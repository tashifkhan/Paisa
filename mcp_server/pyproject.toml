[project]
name = "paisa-mcp"
version = "0.1.0"
description = "MCP server for Paisa personal finance app"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.0.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.0",
    "pyjwt>=2.0.0",
]

[project.scripts]
paisa-mcp = "paisa_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paisa_mcp"]

[dependency-groups]
dev = [
    "ruff>=0.11.0",
]
