# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -Djava.awt.headless=true
kotlin.daemon.jvm.options=-Djava.awt.headless=true
org.gradle.parallel=true
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.workers.max=4
# AGP 9 compatibility: :app applies the Kotlin Multiplatform plugin together
# with com.android.application, which AGP 9's new DSL and built-in Kotlin
# don't support yet. These keep the AGP 8 behavior until :app is split into a
# KMP library plus a thin Android app module.
android.newDsl=false
android.builtInKotlin=false
